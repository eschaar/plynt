# Security workflow.
# Purpose: catch dependency vulnerabilities and leaked secrets before merge.
# Schedule trigger runs only pip-audit (no PR context for secret scanning).
name: Security

on:
  # Security checks are required for all PRs into main.
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly audit every Monday at 06:00 UTC

concurrency:
  # Cancel superseded security scans for the same PR.
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  security:
    # Single job that combines package audit and secret scanning.
    name: Dependency and Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip and setuptools
        # pip-audit requires pip >= 26.1 and setuptools >= 83.0.0 to avoid CVE-2026-3219.
        run: python -m pip install --upgrade "pip>=26.1" "setuptools>=83.0.0"

      - name: Install dependencies
        # pip-audit is included in the [dev] extras; no separate install needed.
        # Auditing the project env ensures the scan covers actual project dependencies.
        run: pip install -e .[dev]

      - name: Python dependency audit
        # Scans all packages installed in the current environment for known CVEs.
        run: pip-audit

      - name: Secret scan
        # Scan only PR diff range to reduce noise and speed up checks.
        # Skipped on schedule trigger (no PR context available).
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
