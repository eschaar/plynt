# Verify real distributions independently of editable development installs.
name: Distribution

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel from sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade 'pip>=26.2,<27' build twine
      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: experimental-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  install:
    name: Wheel (${{ matrix.profile }}, py${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
        profile: [core, httpx, grpc, cdc, django, drf, fastapi, cdc-minimum]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: experimental-distributions
          path: dist
      - name: Install wheel in an isolated environment
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install --upgrade 'pip>=26.2,<27'
          wheel-env/bin/python -m pip uninstall --yes setuptools
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          case "$PROFILE" in
            core) extras="" ;;
            cdc|cdc-minimum) extras="[grpc,salesforce]" ;;
            *) extras="[$PROFILE]" ;;
          esac
          wheel-env/bin/python -m pip install "$wheel$extras" pytest
          if [ "$PROFILE" = "cdc-minimum" ]; then
            wheel-env/bin/python -m pip install \
              'grpcio==1.84.0' 'protobuf==7.35.1' 'fastavro==1.13.1' \
              'PyJWT==2.15.1'
          fi
          wheel-env/bin/python -m pip check
      - name: Run installed-wheel smoke tests
        env:
          PLYNTH_WHEEL_PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$PLYNTH_WHEEL_PROFILE" = "cdc-minimum" ]; then
            export PLYNTH_WHEEL_PROFILE=cdc
          fi
          wheel-env/bin/python -m pytest tests/distribution/test_installed.py \
            --noconftest --import-mode=importlib -c /dev/null \
            -p no:cacheprovider -q
