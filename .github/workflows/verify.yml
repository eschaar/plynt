# Pull request verification workflow.
# Purpose: cross-version test matrix as required PR merge gate.
# This is the primary merge gate for all PRs to main.
name: Verify

on:
  # Run on PRs targeting main so merge decisions are based on full verification.
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  # Cancel superseded verification runs for the same PR.
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Verify jobs only read repository contents.
  contents: read

jobs:
  test-matrix:
    # Cross-version test coverage for all supported Python runtimes.
    # Runs on all PRs to main as a required merge gate.
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: pip install tox

      - name: Tox env listing (evidence)
        run: |
          mkdir -p evidence
          tox -av | tee evidence/tox-env-list-${{ matrix.python-version }}.txt

      - name: Test via tox
        run: |
          tox -e ${{ matrix.python-version }} \
            | tee evidence/tox-run-${{ matrix.python-version }}.txt

      - name: Upload tox evidence
        uses: actions/upload-artifact@v7
        with:
          name: tox-evidence-py${{ matrix.python-version }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
