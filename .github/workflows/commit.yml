# Commit workflow.
# Purpose: enforce commit policy and quality checks (format/lint/typecheck).
# Runs on branch pushes, pull requests, and merge queue refs.
# Unit tests are split into check.yml (single-version) and verify.yml (matrix).
name: Commit

on:
  pull_request:
    branches: [main]
  push:
    # Automated branches receive these checks through pull_request instead.
    branches-ignore:
      - main
      - master
      - release-please--branches--**
      - dependabot/**
  merge_group:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same branch.
  group: commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  validate:
    # Validates commit message format and branch naming policy.
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required to inspect the full pushed commit range.
          fetch-depth: 0

      - name: Validate commits with commit-check
        if: github.event_name == 'push'
        uses: commit-check/commit-check-action@v2
        with:
          # Commit message and branch policy is read from cchk.toml in the repo root.
          message: true
          branch: true
          author-name: false
          author-email: false
          job-summary: true
          pr-comments: false

      - name: Reserve docs(changelog) scope for automation
        shell: bash
        run: |
          TRUSTED_AUTHORS='^(github-actions\[bot\]|prime-releasebot\[bot\])$'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            COMMITS="$(git log --format='%h%x09%s%x09%an' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")"
          else
            if [[ "${GITHUB_ACTOR}" =~ $TRUSTED_AUTHORS ]]; then
              echo "docs(changelog) scope allowed for automation actor."
              exit 0
            fi
            COMMITS="$(git log -1 --format='%h%x09%s%x09%an' "${{ github.sha }}")"
          fi

          VIOLATION_FOUND=false
          while IFS=$'\t' read -r SHA SUBJECT AUTHOR; do
            [[ "$SUBJECT" =~ ^docs\(changelog\): ]] || continue
            [[ "$AUTHOR" =~ $TRUSTED_AUTHORS ]] && continue
            echo "ERROR: commit $SHA uses reserved docs(changelog) scope (author: $AUTHOR)."
            VIOLATION_FOUND=true
          done <<< "$COMMITS"

          if [[ "$VIOLATION_FOUND" == "true" ]]; then
            echo "ERROR: docs(changelog) scope is reserved for automated changelog/release commits."
            echo "Use another scope for manual documentation commits."
            exit 1
          fi

  quality:
    # Lint, format check, and typecheck on the baseline Python version.
    name: Format Lint Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          pip install -e '.[dev,httpx,grpc,salesforce,django,drf,fastapi]'

      - name: Format check
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Typecheck
        run: mypy src tests
