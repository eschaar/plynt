[build-system]
requires = ["setuptools>=84.0.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Derive version from git tags at build time.
# fallback_version is used in environments without a git checkout (e.g. CI
# source tarballs, editable installs before the first tag).
fallback_version = "0.2.0"

[project]
name = "plynt"
dynamic = ["version"]
description = "Framework-agnostic Python library for building external HTTP API clients and service integrations"
readme = "README-pypi.md"
authors = [{ name = "Erik Schaareman" }]
requires-python = ">=3.12"
license = "MIT"
keywords = [
  "api",
  "client",
  "http",
  "rest",
  "salesforce",
  "async",
  "framework-agnostic",
  "integration",
  "service",
  "connector",
  "middleware",
  "oauth2",
  "circuit-breaker",
  "retry",
  "caching",
  "httpx2",
  "pydantic",
  "type-hints",
  "salesforce-api",
  "http-client",
]
license-files = ["LICENSE"]
dependencies = ["pydantic-settings>=2.15.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/eschaar/plynt"
Repository = "https://github.com/eschaar/plynt"
Issues = "https://github.com/eschaar/plynt/issues"
Changelog = "https://github.com/eschaar/plynt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
httpx = ["httpx2>=2.13.1"]
grpc = ["grpcio>=1.84.0,<2", "protobuf>=7.35.1,<8"]
django = ["django>=6.1.2,<7", "httpx2>=2.13.1"]
drf = ["django>=6.1.2,<7", "djangorestframework>=3.18.3,<4", "httpx2>=2.13.1"]
fastapi = ["fastapi>=0.141.1,<1", "httpx2>=2.13.1"]
salesforce = [
  "httpx2>=2.13.1",
  "pydantic>=2.14.1",
  "PyJWT>=2.15.1,<3",
  "cryptography>=50.0.2",
  "fastavro>=1.13.1,<2",
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "time-machine==3.6.0",
  "fakeredis>=2.39.0",
  "vcrpy",
  "types-PyYAML",
]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "time-machine==3.6.0",
  "fakeredis>=2.39.0",
  "vcrpy",
  "types-PyYAML",
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "httpx2>=2.13.1",
  "build",
  "twine",
  "pip-audit",
  "pre-commit>=4.7.0",
  "tox>=4.65.4",
  "grpcio-tools==1.84.0",
  # Security floors for transitive audit and environment tooling.
  "urllib3>=2.8.0,<3",
  "virtualenv>=21.7.13,<22",
]

[tool.pytest.ini_options]
addopts = "--cov=plynt --cov-report=term-missing --tb=short -m 'not external'"
asyncio_mode = "auto"
junit_family = "xunit2"
markers = [
  "external: tests that require external systems, org features, or manual cassettes",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"plynt.connectors.salesforce.cdc._proto" = ["*.proto", "*.md"]

[tool.coverage.run]
omit = [
  "*/__init__.py",
  "*/tests/*",
  "*/connectors/salesforce/cdc/_proto/pubsub_api_pb2.py",
  "*/connectors/salesforce/cdc/_proto/pubsub_api_pb2_grpc.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = ["pragma: no cover", "if __name__ == '__main__':"]

# ---------------------------------------------------------------------------
# Tooling (optional but recommended)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
  "venv",
  "migrations",
  "src/plynt/connectors/salesforce/cdc/_proto/pubsub_api_pb2.py",
  "src/plynt/connectors/salesforce/cdc/_proto/pubsub_api_pb2_grpc.py",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "C90", # mccabe (complexity)
  "I",   # isort
  "N",   # pep8-naming
  "D",   # pydocstyle (docstrings)
  "UP",  # pyupgrade
  "S",   # bandit (security)
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "T20", # flake8-print
  "Q",   # flake8-quotes
  "RUF", # ruff-specific
]
ignore = [
  # Preserve existing generic APIs; PEP 695 migration is a separate refactor.
  "UP040",
  "UP046",
  "UP047",
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in __init__
  "D105", # Missing docstring in magic method
  "D203", # Incompatible with D211 (no-blank-line-before-class); D211 preferred
  "D205", # 1 blank line required between summary line and description
  "D213", # Incompatible with D212 (multi-line-summary-first-line); D212 preferred
  "D400", # First line should end with a period
  "D401", # First line should be in imperative mood
  "D415", # First line should end with a period, question mark, or exclamation point
  "D417", # Missing argument descriptions — project convention: omit self-explanatory args
]
per-file-ignores = { "tests/*" = [
  "D",
  "ARG001",
  "ARG002",
  "ARG005",
  "S101",
  "S105",
  "S106",
  "S107",
], "examples/**" = [
  "D",
  "T20",
] }

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
allow_untyped_globals = true
exclude = [
  "^src/plynt/connectors/salesforce/cdc/_proto/pubsub_api_pb2\\.py$",
  "^src/plynt/connectors/salesforce/cdc/_proto/pubsub_api_pb2_grpc\\.py$",
]

[[tool.mypy.overrides]]
# Vendored/generated Salesforce Pub/Sub stub: not hand-maintained, do not
# type-check as project code. See _proto/README.md. follow_imports=skip
# treats these modules as untyped (Any), which also avoids no-untyped-call
# errors in callers that construct the generated stub classes.
module = [
  "plynt.connectors.salesforce.cdc._proto.pubsub_api_pb2",
  "plynt.connectors.salesforce.cdc._proto.pubsub_api_pb2_grpc",
]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# _ReadableDumper(Dumper) requires type: ignore[misc] for Pylance/pyright
# because the base class resolves to CDumper (a C extension) at runtime.
# mypy does not flag the inheritance itself, so the ignore appears unused to it.
module = "plynt.testsupport.vcr.serializer"
warn_unused_ignores = false

# ---------------------------------------------------------------------------
# Tox — multi-version test matrix
# ---------------------------------------------------------------------------

[tool.tox]
requires = ["tox>=4"]
env_list = ["3.12", "3.13", "3.14", "3.15"]

[tool.tox.env_run_base]
description = "Run test suite under {env_name}"
extras = ["test", "httpx", "grpc", "salesforce", "django", "drf", "fastapi"]
package = "wheel"
commands = [["pytest", "--tb=short", "-q"]]

# ---------------------------------------------------------------------------
# Pyright / Pylance (VS Code)
# ---------------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pylint.main]
ignore-paths = ["^tests/.*$", "^src/plynt/connectors/salesforce/cdc/_proto/.*$"]

[tool.pylint.messages_control]
disable = ["missing-function-docstring"]
